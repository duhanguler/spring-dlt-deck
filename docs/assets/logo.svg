<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="spring-dlt-deck — Dead-Letter Topic Control Plane for Spring Boot 4.2 and Apache Kafka 4.4">
  <rect width="1200" height="260" fill="#09090b" rx="8"/>
  <rect x="0.5" y="0.5" width="1199" height="259" fill="none" stroke="#222229" rx="8"/>
  <!-- Subtle architectural gridlines -->
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#141418" stroke-width="1"/>
  <line x1="0" y1="196" x2="1200" y2="196" stroke="#141418" stroke-width="1"/>
  <line x1="88" y1="0" x2="88" y2="260" stroke="#141418" stroke-width="1"/>
  <line x1="1112" y1="0" x2="1112" y2="260" stroke="#141418" stroke-width="1"/>

  <!-- Monochrome Brand Mark -->
  <rect x="88" y="78" width="44" height="44" rx="6" fill="#fafafa"/>
  <text x="110" y="109" text-anchor="middle" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">D</text>

  <!-- Title & Version Pill -->
  <text x="150" y="110" fill="#f4f4f5" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="600" letter-spacing="-0.03em">spring-dlt-deck</text>
  <rect x="466" y="84" width="66" height="24" rx="4" fill="#141418" stroke="#27272a"/>
  <text x="499" y="100" text-anchor="middle" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">v0.1.0</text>

  <!-- Subtitle -->
  <text x="88" y="156" fill="#a1a1aa" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18.5" font-weight="400">Fail-Closed Dead-Letter Topic Control Plane for Spring Boot 4.2 &amp; Apache Kafka 4.4</text>

  <!-- Telemetry Pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
    <rect x="88" y="182" width="142" height="26" rx="4" fill="#141418" stroke="#222229"/>
    <circle cx="102" cy="195" r="3.5" fill="#4ade80"/>
    <text x="114" y="199" fill="#f4f4f5">Java 25 · Boot 4.2</text>

    <rect x="240" y="182" width="154" height="26" rx="4" fill="#141418" stroke="#222229"/>
    <circle cx="254" cy="195" r="3.5" fill="#4ade80"/>
    <text x="266" y="199" fill="#f4f4f5">Key-Ordered Stripes</text>

    <rect x="404" y="182" width="146" height="26" rx="4" fill="#141418" stroke="#222229"/>
    <circle cx="418" cy="195" r="3.5" fill="#60a5fa"/>
    <text x="430" y="199" fill="#f4f4f5">strict CSP nonce</text>

    <rect x="560" y="182" width="158" height="26" rx="4" fill="#141418" stroke="#222229"/>
    <circle cx="574" cy="195" r="3.5" fill="#fbbf24"/>
    <text x="586" y="199" fill="#f4f4f5">Four-Eyes · HITL MCP</text>

    <rect x="728" y="182" width="172" height="26" rx="4" fill="#141418" stroke="#222229"/>
    <circle cx="742" cy="195" r="3.5" fill="#f4f4f5"/>
    <text x="754" y="199" fill="#f4f4f5">2-TX Fenced Replay</text>
  </g>

  <!-- Right-side Minimal Telemetry Sparkline Card -->
  <g transform="translate(918, 74)">
    <rect width="194" height="114" rx="6" fill="#0e0e11" stroke="#222229"/>
    <line x1="14" y1="34" x2="180" y2="34" stroke="#222229" stroke-dasharray="2 3"/>
    <line x1="14" y1="62" x2="180" y2="62" stroke="#222229" stroke-dasharray="2 3"/>
    <line x1="14" y1="90" x2="180" y2="90" stroke="#222229" stroke-dasharray="2 3"/>
    <path d="M18,84 L48,68 L78,74 L108,48 L138,54 L174,26 L174,90 L18,90 Z" fill="rgba(244,244,245,0.07)"/>
    <path d="M18,84 L48,68 L78,74 L108,48 L138,54 L174,26" fill="none" stroke="#f4f4f5" stroke-width="1.75"/>
    <circle cx="174" cy="26" r="3.5" fill="#0e0e11" stroke="#4ade80" stroke-width="1.75"/>
    <text x="14" y="21" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">lag 0 · 0 INDETERMINATE</text>
    <text x="14" y="106" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Kafka 4.4 / PG 17</text>
  </g>
